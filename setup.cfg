
[metadata]
name = seg2ml
author = Priya Tomar
author_email = priya.tomar335@gmail.com
description = Segmentation of surgical images!
license = MIT
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8; variant=GFM
url = https://github.com/PriyaTomar/GauzeSeg

platforms = any


classifiers =
    Programming Language :: Python


[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    =src
install_requires =
    importlib-metadata; python_version<"3.8"


[options.packages.find]
where = src
exclude =
    tests

[options.extras_require]

testing =
    setuptools
    pytest
    pytest-cov

[options.entry_points]

[tool:pytest]

addopts =
    --cov seg2ml --cov-report term-missing
    --verbose
norecursedirs =
    dist
    build
    .tox
testpaths = tests

[bdist_wheel]
universal = 1

[devpi:upload]
no_vcs = 1
formats = bdist_wheel

[pyscaffold]

version = 4.0.2
package = seg2ml
extensions =
    dsproject
    markdown
    no_skeleton
    pre_commit
